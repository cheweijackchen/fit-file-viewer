
version: "3.1"
services:
  nodejs:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    working_dir: /application
    volumes:
      - ..:/application
    environment:
      - FE_DEV_PORT
      - FE_SSR_PORT
      - CLAUDE_CODE_DEV_PORT
    ports:
      - "${FE_DEV_PORT}:${FE_DEV_PORT}"
      - "${FE_SSR_PORT}:${FE_SSR_PORT}"
      - "${CLAUDE_CODE_DEV_PORT}:${CLAUDE_CODE_DEV_PORT}"
    command: >
      bash -c 'for((i=1;;i+=2)); do sleep 1 && echo "Counter: $$i"; done'
    profiles:
      - web-services
